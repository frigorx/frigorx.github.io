<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>
// Auto-connect via #cfg= OU connect.html
(function(){
  var h=location.hash;
  if(h.indexOf('#cfg=')===0){
    try{var d=JSON.parse(atob(decodeURIComponent(h.substring(5))));
    if(d.apiUrl&&d.apiKey)localStorage.setItem('inerweb-tt-fe-cfg',JSON.stringify(d));
    }catch(e){}
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>EP2 — CAP IFCA — CCF | inerWeb &Eacute;du</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bleu:#1b3a63;--bleu2:#2d5a8c;--bleu3:#e8f0f8;--orange:#ff6b35;--vert:#27ae60;--vert2:#d4f4e2;--rouge:#e74c3c;--rouge2:#fde8e6;--teal:#16a085;--teal2:#d0f0ea;--violet:#8e44ad;--violet2:#f3e5f5;--jaune:#f39c12;--jaune2:#fef9e7;--gris:#6c757d;--gris2:#f0f2f5;--gris3:#dee2e6;--texte:#1a2332;--r:12px;--r2:8px;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;color:var(--texte);background:var(--gris2);min-height:100dvh}
input,select,textarea,button{font-family:inherit}
/* HEADER */
.hdr{background:linear-gradient(90deg,var(--bleu2),var(--bleu));color:#fff;padding:.65rem 1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr h1{font-size:.95rem;font-weight:900}.hdr-sub{font-size:.6rem;opacity:.7}
.badge{background:rgba(255,255,255,.2);border-radius:20px;padding:.15rem .6rem;font-size:.6rem;font-weight:800}
.wrap{max-width:900px;margin:0 auto;padding:.75rem}
/* CARDS ELEVES */
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem}
.ecard{background:#fff;border-radius:var(--r);padding:.5rem;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:all .15s}
.ecard:hover{border-color:var(--bleu2);transform:translateY(-1px)}
.enom{font-size:.78rem;font-weight:900;color:var(--bleu)}.ecode{font-size:.6rem;color:var(--gris)}
.eradar{width:100%;height:75px;margin:.2rem 0;pointer-events:none}
.epct{font-size:.62rem;font-weight:800;text-align:center}
/* DETAIL */
#detail{display:none}
.back-btn{background:var(--gris2);border:none;border-radius:var(--r2);padding:.35rem .7rem;font-size:.75rem;font-weight:700;cursor:pointer}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:.78rem;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.tbl thead{background:var(--bleu);color:#fff;font-size:.7rem}
.tbl th{padding:.45rem .35rem;font-weight:800;text-align:center}
.tbl th:nth-child(1),.tbl th:nth-child(2){text-align:left}
.tbl th.c-at{background:var(--bleu2)}.tbl th.c-st{background:var(--teal)}.tbl th.c-rt{background:var(--orange)}.tbl th.c-ret{background:#333}
.tbl td{padding:.35rem .3rem;border-bottom:1px solid var(--gris3)}
.tbl tr{cursor:pointer;transition:background .1s}.tbl tbody tr:hover{background:var(--bleu3)}
.niv{display:inline-block;padding:.1rem .35rem;border-radius:4px;font-weight:900;font-size:.72rem;text-align:center;min-width:28px}
.niv-NE{background:#e0e0e0;color:#666}.niv-EC{background:#fff3cd;color:#856404}.niv-M{background:#d4edda;color:#155724}.niv-PM{background:#cce5ff;color:#004085}
.niv-empty{color:var(--rouge);font-weight:700}
.cnt{font-size:.55rem;color:var(--gris);margin-left:1px}
/* DETAIL ROW */
.drow{display:none;background:var(--gris2)}
.drow.open{display:table-row}
.drow td{padding:.4rem .5rem}
.src-title{font-size:.7rem;font-weight:900;margin:.3rem 0 .15rem}
.src-at{color:var(--bleu2)}.src-st{color:var(--teal)}.src-rt{color:var(--orange)}
.task{font-size:.7rem;padding:.15rem .3rem;background:#fff;border-radius:3px;margin-bottom:.1rem;display:flex;justify-content:space-between;align-items:center}
.task-at{border-left:3px solid var(--bleu2)}.task-st{border-left:3px solid var(--teal)}.task-rt{border-left:3px solid var(--orange)}
/* JURY BUTTONS */
.jbtns{display:flex;gap:.2rem;flex-wrap:wrap;margin:.2rem 0}
.jbtn{padding:.2rem .5rem;border:2px solid var(--gris3);border-radius:5px;background:#fff;font-size:.7rem;font-weight:900;cursor:pointer;min-width:34px;text-align:center;transition:all .1s}
.jbtn:active{transform:scale(.95)}
.jbtn.on-NE{background:#e0e0e0;border-color:#999;color:#666}
.jbtn.on-EC{background:#fff3cd;border-color:#856404;color:#856404}
.jbtn.on-M{background:#d4edda;border-color:#155724;color:#155724}
.jbtn.on-PM{background:#cce5ff;border-color:#004085;color:#004085}
/* RETENU SELECT */
.ret-sel{padding:.2rem .3rem;border:2px solid var(--orange);border-radius:var(--r2);font-weight:900;font-size:.75rem;width:52px}
/* JURY BLOCK */
.jury{background:rgba(255,107,53,.07);border-left:4px solid var(--orange);border-radius:var(--r2);padding:.5rem;margin-bottom:.5rem}
.jury h4{font-size:.8rem;color:var(--orange);font-weight:900;margin-bottom:.25rem}
.jury-row{display:flex;gap:.4rem;flex-wrap:wrap}
.jury-row input{flex:1;min-width:90px;padding:.3rem;border:1px solid var(--gris3);border-radius:var(--r2);font-size:.75rem}
/* FRANÇAIS */
.fr-block{border-top:4px solid var(--violet);border-radius:var(--r);overflow:hidden;margin-top:.5rem;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.fr-head{background:var(--violet);color:#fff;padding:.45rem .6rem;display:flex;justify-content:space-between;font-weight:900;font-size:.82rem}
.fr-cat{margin-bottom:.3rem}
.fr-cat-head{padding:.3rem .5rem;color:#fff;font-size:.72rem;font-weight:800;display:flex;justify-content:space-between}
.fr-crit{display:flex;align-items:center;gap:.3rem;padding:.25rem .5rem;background:#fff;border-bottom:1px solid var(--gris3);font-size:.72rem}
.fr-crit-label{flex:1}.fr-crit-id{font-weight:900;min-width:22px}
.fr-slider{width:55px}
.fr-val{font-weight:900;min-width:18px;text-align:center}
/* SEND */
.send{background:#fff;border-radius:var(--r);padding:.5rem;margin-top:.5rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.send textarea{width:100%;border:1px solid var(--gris3);border-radius:var(--r2);padding:.3rem;font-size:.75rem;min-height:40px;resize:vertical;font-family:inherit;margin-bottom:.3rem}
.btn-send{background:var(--vert);color:#fff;border:none;border-radius:var(--r2);padding:.55rem 1.5rem;font-size:.85rem;font-weight:900;cursor:pointer}
.btn-send:active{transform:scale(.97)}.btn-send:disabled{opacity:.4}
/* TOAST */
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);padding:.5rem 1rem;border-radius:var(--r2);color:#fff;font-weight:700;font-size:.78rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}.toast.ok{background:var(--vert)}.toast.err{background:var(--rouge)}.toast.warn{background:var(--jaune)}
.empty{text-align:center;padding:2rem;color:var(--gris)}
</style>
</head>
<body>
<div class="hdr">
  <div><h1>&#x2744; EP2 &mdash; R&eacute;alisation d'une installation</h1><div class="hdr-sub">CAP IFCA &mdash; CCF</div></div>
  <span class="badge" id="badge">Chargement...</span>
</div>
<div class="wrap">
  <!-- VUE 1: DASHBOARD -->
  <div id="dashboard"><div class="dash" id="dashGrid"></div></div>
  <!-- VUE 2: DETAIL -->
  <div id="detail">
    <div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:var(--r);padding:.5rem .6rem;margin-bottom:.4rem;box-shadow:0 2px 8px rgba(0,0,0,.06)">
      <div><div id="dNom" style="font-size:1rem;font-weight:900;color:var(--bleu)"></div><div id="dInfo" style="font-size:.68rem;color:var(--gris)"></div></div>
      <button class="back-btn" onclick="showDash()">&#x2190; Retour</button>
    </div>
    <!-- JURY -->
    <div class="jury"><h4>&#x1F468;&#x200D;&#x2696;&#xFE0F; Jury retour de stage</h4>
      <div class="jury-row">
        <input id="jPro" placeholder="Prof technique"><input id="jFr" placeholder="Prof fran&ccedil;ais"><input type="date" id="jDt">
      </div>
    </div>
    <!-- TABLEAU COMPETENCES -->
    <div id="tblWrap"></div>
    <!-- GRILLE FRANÇAIS -->
    <div class="fr-block"><div class="fr-head"><span>&#x1F4DA; Oral Fran&ccedil;ais &mdash; Retour de stage</span><span id="frTotal">0/20</span></div>
      <div style="padding:.4rem .5rem;background:#fff">
        <div style="margin-bottom:.3rem"><input id="frExam" placeholder="Examinateur fran&ccedil;ais" style="width:100%;padding:.25rem;border:1px solid var(--gris3);border-radius:var(--r2);font-size:.75rem"></div>
        <div id="frGrille"></div>
        <textarea id="frObs" placeholder="Observations prof fran&ccedil;ais..." style="width:100%;border:1px solid var(--gris3);border-radius:var(--r2);padding:.25rem;font-size:.72rem;min-height:30px;resize:vertical;font-family:inherit;margin-top:.2rem"></textarea>
      </div>
    </div>
    <!-- ENVOI -->
    <div class="send">
      <textarea id="obsG" placeholder="Observation globale du jury (technique + fran&ccedil;ais)..."></textarea>
      <button class="btn-send" id="btnSend" onclick="envoyer()">&#x2705; Valider et envoyer au serveur</button>
    </div>
    <div style="text-align:center;margin-top:.5rem"><a href="inerweb_prof.html" style="color:var(--gris);font-size:.75rem">&#x2190; Retour interface prof</a></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/core/inerweb.config.js"></script>
<script>
(function(){
'use strict';

// ═══ CONFIG ═══
var API='',KEY='';
(function(){
  try{var s=localStorage.getItem('inerweb-tt-fe-cfg');if(s){var c=JSON.parse(s);API=c.apiUrl||'';KEY=c.apiKey||'';}}catch(e){}
  if(!API&&window.INERWEB_CONFIG){API=window.INERWEB_CONFIG.API_URL||'';KEY=window.INERWEB_CONFIG.API_KEY||'';}
  // Fallback en dur
  if(!API){API='https://script.google.com/macros/s/AKfycbzVvXZRi4975OM4P8AJeoDWvnTbFSfTpVUDErzrNk2R2knfxBxCw-A-kLmKaNzmW35V1A/exec';KEY='inerWeb2026fh';}
})();

// ═══ DONNÉES ═══
var students=[],curCode='',tuteurEvals={},allVals={};
var retourState={},retenuState={},frScores={};

// ═══ COMPÉTENCES EP2 CAP IFCA ═══
var COMPS=[
  {code:"C2.1",nom:"Pr\u00e9parer intervention",obl:true,poids:1},
  {code:"C3.1",nom:"Organiser son poste",obl:true,poids:1.5},
  {code:"C3.2",nom:"Identifier r\u00e9seaux",obl:true,poids:2},
  {code:"C3.3",nom:"Implanter, fixer",obl:true,poids:2},
  {code:"C3.4",nom:"Fa\u00e7onner, raccorder",obl:true,poids:2.5},
  {code:"C3.5",nom:"Soudure/PER",obl:true,poids:2.5},
  {code:"C3.6",nom:"C\u00e2bler, connecter",obl:true,poids:2},
  {code:"C3.7",nom:"Contr\u00f4les pr\u00e9alables",obl:true,poids:1.5},
  {code:"C3.8",nom:"Tri d\u00e9chets",obl:false,poids:1},
  {code:"C3.9",nom:"\u00c9tanch\u00e9it\u00e9",obl:true,poids:2}
];
var NIVS=['NE','EC','M','PM'];
var NIV_CLR={NE:'#e0e0e0',EC:'#fff3cd',M:'#d4edda',PM:'#cce5ff'};
var NIV_TXT={NE:'#666',EC:'#856404',M:'#155724',PM:'#004085'};

// ═══ GRILLE FRANÇAIS ═══
var FR=[
  {cat:"Communication",bar:7,clr:'#2d5a8c',cr:[{id:"C1",lb:"Comportement physique (posture, regard, notes)",mx:2},{id:"C2",lb:"Expos\u00e9 coh\u00e9rent ~5 min",mx:2},{id:"C3",lb:"Expression claire (ton, voix, d\u00e9bit)",mx:2},{id:"C4",lb:"Dialogue, r\u00e9action, int\u00e9r\u00eat auditoire",mx:1}]},
  {cat:"Argumentation",bar:10,clr:'#8e44ad',cr:[{id:"A1",lb:"Avis argument\u00e9 avec exemples",mx:2},{id:"A2",lb:"Cherche \u00e0 convaincre",mx:2},{id:"A3",lb:"Vivacit\u00e9, raisonnement coh\u00e9rent",mx:2},{id:"A4",lb:"Rapprochement stage/parcours",mx:2},{id:"A5",lb:"Projet d'orientation",mx:2}]},
  {cat:"Outils linguistiques",bar:3,clr:'#ff6b35',cr:[{id:"L1",lb:"Langue pr\u00e9cise et correcte",mx:3}]}
];

// ═══ HELPERS ═══
function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast show '+(t||'ok');setTimeout(function(){e.className='toast'},3500)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function dfr(iso){if(!iso)return'\u2014';try{return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}catch(e){return String(iso).slice(0,10)}}
function best(arr){var o={NE:0,EC:1,M:2,PM:3},b='';arr.forEach(function(v){if(v.niveau&&(o[v.niveau]||0)>(o[b]||0))b=v.niveau});return b}

// ═══ API ═══
async function apiGet(action,p){var u=new URL(API);u.searchParams.set('action',action);u.searchParams.set('key',KEY);if(p)Object.entries(p).forEach(function(kv){u.searchParams.set(kv[0],kv[1])});var r=await fetch(u.toString(),{redirect:'follow'});return r.json()}
async function apiPost(action,body){var u=new URL(API);u.searchParams.set('action',action);body.apiKey=KEY;var r=await fetch(u.toString(),{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});return r.json()}

// ═══ INIT ═══
async function init(){
  if(!API){toast('API non configur\u00e9e','err');return}
  document.getElementById('badge').textContent='Sync...';
  try{
    var d=await apiGet('getDashboard');
    if(Array.isArray(d))students=d;
    var et=await apiGet('getEvalTuteur');
    if(Array.isArray(et))et.forEach(function(e){var c=e.eleveCode;if(!c)return;if(!tuteurEvals[c])tuteurEvals[c]=[];tuteurEvals[c].push(e)});
    // Charger validations depuis localStorage prof si dispo
    try{var raw=localStorage.getItem('inerweb-tt-fe-v1');if(raw){var p=JSON.parse(raw);if(p.validations)allVals=p.validations}}catch(e){}
    document.getElementById('badge').textContent='\u2705 '+students.length+' \u00e9l\u00e8ves';
    showDash();
  }catch(e){toast('Erreur: '+e.message,'err');document.getElementById('badge').textContent='\u274c Erreur'}
}

// ═══ DASHBOARD ═══
function showDash(){
  curCode='';document.getElementById('detail').style.display='none';document.getElementById('dashboard').style.display='';
  var cap=students.filter(function(s){return s.classe&&(s.classe.indexOf('CAP')>=0||s.classe.indexOf('IFCA')>=0)});
  if(!cap.length){document.getElementById('dashGrid').innerHTML='<div class="empty">Aucun \u00e9l\u00e8ve CAP IFCA</div>';return}
  var h='';
  cap.forEach(function(s){
    var st=stats(s.code),pct=st.t>0?Math.round(st.d/st.t*100):0;
    var clr=pct>=80?'var(--vert)':pct>=40?'var(--jaune)':'var(--rouge)';
    h+='<div class="ecard" onclick="showDetail(\''+s.code+'\')"><div class="enom">'+esc(s.nom)+' '+esc(s.prenom||'')+'</div><div class="ecode">'+s.code+'</div><canvas class="eradar" id="rd_'+s.code+'"></canvas><div class="epct" style="color:'+clr+'">'+pct+'% ('+st.d+'/'+st.t+')</div></div>'
  });
  document.getElementById('dashGrid').innerHTML=h;
  cap.forEach(function(s){radar(s.code)});
}

function stats(code){
  var v=allVals[code]||[];if(!Array.isArray(v))v=[];var d=0;
  COMPS.forEach(function(c){
    var has=v.some(function(x){return x.competence===c.code&&x.niveau&&x.niveau!=='NE'});
    if(!has)(tuteurEvals[code]||[]).forEach(function(ev){
      var cp={};try{cp=typeof ev.competences==='string'?JSON.parse(ev.competences):(ev.competences||{})}catch(e){}
      var n=cp[c.code];var nv=typeof n==='object'?n.niveau:n;if(nv&&nv!=='NE')has=true
    });
    if(has)d++
  });
  return{d:d,t:COMPS.length}
}

function bestNiv(code,comp){
  var o={NE:0,EC:1,M:2,PM:3},b='NE';
  var v=allVals[code]||[];if(Array.isArray(v))v.forEach(function(x){if(x.competence===comp&&x.niveau&&(o[x.niveau]||0)>(o[b]||0))b=x.niveau});
  (tuteurEvals[code]||[]).forEach(function(ev){
    var cp={};try{cp=typeof ev.competences==='string'?JSON.parse(ev.competences):(ev.competences||{})}catch(e){}
    var n=cp[comp];var nv=typeof n==='object'?n.niveau:n;if(nv&&(o[nv]||0)>(o[b]||0))b=nv
  });
  return b
}

function radar(code){
  var cv=document.getElementById('rd_'+code);if(!cv)return;
  var ctx=cv.getContext('2d'),w=cv.offsetWidth||150,h=cv.offsetHeight||75;
  cv.width=w*2;cv.height=h*2;ctx.scale(2,2);
  var cx=w/2,cy=h/2+2,r=Math.min(w,h)/2-6,n=COMPS.length,nm={NE:0,EC:.35,M:.7,PM:1};
  ctx.beginPath();for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2;ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a))}ctx.closePath();ctx.fillStyle='rgba(27,58,99,.05)';ctx.fill();ctx.strokeStyle='#ddd';ctx.lineWidth=.5;ctx.stroke();
  ctx.beginPath();for(var i=0;i<n;i++){var nv=bestNiv(code,COMPS[i].code),v=nm[nv]||0,a=Math.PI*2*i/n-Math.PI/2;ctx.lineTo(cx+r*v*Math.cos(a),cy+r*v*Math.sin(a))}ctx.closePath();ctx.fillStyle='rgba(39,174,96,.2)';ctx.fill();ctx.strokeStyle='#27ae60';ctx.lineWidth=1.5;ctx.stroke()
}

// ═══ DETAIL ELEVE ═══
function showDetail(code){
  try{
    curCode=code;retourState={};retenuState={};frScores={};
    document.getElementById('dashboard').style.display='none';
    document.getElementById('detail').style.display='block';
    var s=students.find(function(x){return x.code===code})||{};
    document.getElementById('dNom').textContent=(s.nom||'')+' '+(s.prenom||'');
    document.getElementById('dInfo').textContent=s.code+' \u00b7 '+(s.classe||'');
    document.getElementById('jDt').value=new Date().toISOString().slice(0,10);
    renderTable(code);
    renderFr();
    window.scrollTo(0,0);
  }catch(e){
    alert('Erreur showDetail: '+e.message);
    console.error(e);
  }
}

// ═══ TABLEAU 3 COLONNES ═══
function renderTable(code){
  var v=allVals[code]||[];if(!Array.isArray(v))v=[];
  var h='<table class="tbl"><thead><tr><th>Code</th><th>Comp\u00e9tence</th><th class="c-at">\uD83D\uDD27 Atelier</th><th class="c-st">\uD83C\uDFED Stage</th><th class="c-rt">\uD83D\uDCCA Retour</th><th class="c-ret">\u27A1 Retenu</th></tr></thead><tbody>';

  COMPS.forEach(function(c,i){
    var atV=v.filter(function(x){return x.competence===c.code&&x.phase!=='tuteur'&&x.phase!=='retour_stage'});
    var stV=[];(tuteurEvals[code]||[]).forEach(function(ev){var cp={};try{cp=typeof ev.competences==='string'?JSON.parse(ev.competences):(ev.competences||{})}catch(e){}var n=cp[c.code];var nv=typeof n==='object'?n.niveau:n;if(nv)stV.push({niveau:nv,evaluateur:ev.tuteur||'Tuteur',timestamp:ev.timestamp,entreprise:ev.entreprise||''})});
    var rtV=v.filter(function(x){return x.competence===c.code&&x.phase==='retour_stage'});
    var bA=best(atV),bS=best(stV),bR=best(rtV),rN=retourState[c.code]||'';
    var tot=atV.length+stV.length+rtV.length;
    var curRet=retenuState[c.code]||bestNiv(code,c.code);
    var bg=i%2===0?'#fff':'#f9fafb';

    // Ligne principale
    h+='<tr style="background:'+bg+'" onclick="toggle(\''+c.code+'\')">';
    h+='<td style="font-weight:900;color:var(--bleu2);white-space:nowrap">'+c.code+(c.obl?' <span style="color:var(--orange)">\u2731</span>':'')+'</td>';
    h+='<td style="font-size:.72rem">'+esc(c.nom)+(tot>0?' <span class="cnt">\u00d7'+tot+'</span>':'')+'</td>';
    h+=nivTd(bA,atV.length);h+=nivTd(bS,stV.length);h+=nivTd(rN||bR,rtV.length);
    // Retenu select
    h+='<td style="text-align:center" onclick="event.stopPropagation()"><select class="ret-sel" style="background:'+(NIV_CLR[curRet]||'#fff')+';color:'+(NIV_TXT[curRet]||'var(--gris)')+'" onchange="retenuChanged(this,\''+c.code+'\')">';
    h+='<option value="">'+curRet+'</option>';NIVS.forEach(function(n){h+='<option value="'+n+'"'+(retenuState[c.code]===n?' selected':'')+'>'+n+'</option>'});
    h+='</select></td></tr>';

    // Ligne détail dépliable
    h+='<tr class="drow" id="dr_'+c.code+'"><td colspan="6"><div style="padding:.3rem">';
    // Atelier
    h+='<div class="src-title src-at">\uD83D\uDD27 Atelier ('+atV.length+')</div>';
    if(atV.length){atV.forEach(function(x){h+='<div class="task task-at"><span>'+esc(x.contexte||'atelier')+' \u00b7 '+dfr(x.timestamp)+' \u00b7 '+esc(x.evaluateur||'')+'</span><span class="niv niv-'+x.niveau+'">'+x.niveau+'</span></div>'})}
    else h+='<div style="font-size:.68rem;color:var(--gris);font-style:italic">Pas encore \u00e9valu\u00e9</div>';
    // Stage
    h+='<div class="src-title src-st">\uD83C\uDFED Stage tuteur ('+stV.length+')</div>';
    if(stV.length){stV.forEach(function(x){h+='<div class="task task-st"><span>\uD83C\uDFE2 '+esc(x.entreprise)+' \u00b7 '+esc(x.evaluateur)+' \u00b7 '+dfr(x.timestamp)+'</span><span class="niv niv-'+x.niveau+'">'+x.niveau+'</span></div>'})}
    else h+='<div style="font-size:.68rem;color:var(--gris);font-style:italic">\u00c9val tuteur non re\u00e7ue</div>';
    // Retour stage
    h+='<div class="src-title src-rt">\uD83D\uDCCA Retour stage \u2014 \u00c9val jury</div>';
    if(rtV.length){rtV.forEach(function(x){h+='<div class="task task-rt"><span>'+esc(x.evaluateur||'')+' \u00b7 '+dfr(x.timestamp)+'</span><span class="niv niv-'+x.niveau+'">'+x.niveau+'</span></div>'})}
    h+='<div class="jbtns" onclick="event.stopPropagation()">';NIVS.forEach(function(n){h+='<button class="jbtn'+(rN===n?' on-'+n:'')+'" onclick="setRetour(\''+c.code+'\',\''+n+'\')">'+n+'</button>'});h+='</div>';

    h+='</div></td></tr>'
  });

  h+='</tbody></table>';
  document.getElementById('tblWrap').innerHTML=h
}

function nivTd(niv,cnt){
  if(!niv||niv==='NE')return '<td style="text-align:center"><span class="niv-empty">\u2014</span></td>';
  return '<td style="text-align:center"><span class="niv niv-'+niv+'">'+niv+'</span>'+(cnt>1?'<span class="cnt">\u00d7'+cnt+'</span>':'')+'</td>'
}

function toggle(code){var r=document.getElementById('dr_'+code);if(r)r.classList.toggle('open')}
function setRetour(code,niv){retourState[code]=niv;renderTable(curCode)}
function setRetenu(code,niv){retenuState[code]=niv}
function retenuChanged(sel,code){setRetenu(code,sel.value);var c=NIV_CLR[sel.value]||'#fff';var t=NIV_TXT[sel.value]||'#666';sel.style.background=c;sel.style.color=t}

// ═══ FRANÇAIS ═══
function renderFr(){
  var h='';
  FR.forEach(function(cat){
    var ct=0;cat.cr.forEach(function(c){ct+=(frScores[c.id]||0)});
    h+='<div class="fr-cat"><div class="fr-cat-head" style="background:'+cat.clr+'"><span>'+esc(cat.cat)+' (/'+cat.bar+')</span><span style="background:rgba(255,255,255,.3);padding:.1rem .4rem;border-radius:10px">'+ct+'/'+cat.bar+'</span></div>';
    cat.cr.forEach(function(c){
      var v=frScores[c.id]||0;
      h+='<div class="fr-crit"><span class="fr-crit-id" style="color:'+cat.clr+'">'+c.id+'</span><span class="fr-crit-label">'+esc(c.lb)+'</span><input type="range" class="fr-slider" style="accent-color:'+cat.clr+'" min="0" max="'+c.mx+'" step="0.5" value="'+v+'" oninput="setFr(\''+c.id+'\',parseFloat(this.value))"><span class="fr-val">'+v+'</span><span style="font-size:.6rem;color:var(--gris)">/'+c.mx+'</span></div>'
    });
    h+='</div>'
  });
  document.getElementById('frGrille').innerHTML=h;
  var tot=0;FR.forEach(function(cat){cat.cr.forEach(function(c){tot+=(frScores[c.id]||0)})});
  document.getElementById('frTotal').textContent=tot+'/20'
}

function setFr(id,v){frScores[id]=v;renderFr()}

// ═══ ENVOYER ═══
async function envoyer(){
  if(!curCode){toast('Aucun \u00e9l\u00e8ve','err');return}
  var btn=document.getElementById('btnSend');btn.disabled=true;btn.textContent='Envoi...';
  var obs=document.getElementById('obsG').value.trim();
  var pro=document.getElementById('jPro').value.trim();
  var fr=document.getElementById('jFr').value.trim();
  var dt=document.getElementById('jDt').value;
  var ev=(pro||'Prof')+(fr?' + '+fr:'');
  var ts=new Date().toISOString();
  var sent=0,err=0;

  // Retour stage technique
  var rc=Object.keys(retourState).filter(function(k){return retourState[k]&&retourState[k]!=='NE'});
  for(var i=0;i<rc.length;i++){try{await apiPost('saveValidation',{eleve:curCode,data:{epreuve:'EP2',competence:rc[i],critere:'',niveau:retourState[rc[i]],contexte:'retour_stage',phase:'retour_stage',evaluateur:ev,timestamp:ts,source:'ccf_ep2'}});sent++}catch(e){err++}}

  // Niveaux retenus
  var rk=Object.keys(retenuState).filter(function(k){return retenuState[k]});
  for(var i=0;i<rk.length;i++){try{await apiPost('saveValidation',{eleve:curCode,data:{epreuve:'EP2',competence:rk[i],critere:'',niveau:retenuState[rk[i]],contexte:'niveau_retenu',phase:'certificatif',evaluateur:ev,timestamp:ts,source:'ccf_ep2'}});sent++}catch(e){err++}}

  // Français
  var frExam=document.getElementById('frExam').value.trim();
  var frObs=document.getElementById('frObs').value.trim();
  var fc=Object.keys(frScores).filter(function(k){return frScores[k]>0});
  if(fc.length){
    var ftot=0;FR.forEach(function(cat){cat.cr.forEach(function(c){ftot+=(frScores[c.id]||0)})});
    try{await apiPost('saveValidation',{eleve:curCode,data:{epreuve:'ORAL_FR',competence:'__oral_francais__',critere:'',niveau:String(ftot),observation:frObs,contexte:'retour_stage',phase:'retour_stage',evaluateur:frExam||'Prof Fran\u00e7ais',timestamp:ts,source:'ccf_ep2_fr',_scores:JSON.parse(JSON.stringify(frScores))}});sent++}catch(e){err++}
    for(var i=0;i<fc.length;i++){try{await apiPost('saveValidation',{eleve:curCode,data:{epreuve:'ORAL_FR',competence:fc[i],critere:'',niveau:String(frScores[fc[i]]),contexte:'retour_stage',phase:'retour_stage',evaluateur:frExam||'Prof Fran\u00e7ais',timestamp:ts,source:'ccf_ep2_fr'}});sent++}catch(e){err++}}
  }

  // Observation globale
  if(obs){try{await apiPost('saveValidation',{eleve:curCode,data:{epreuve:'EP2',competence:'__obs_jury__',critere:'',niveau:'OBS',observation:obs,contexte:'retour_stage',phase:'retour_stage',evaluateur:ev,timestamp:ts,source:'ccf_ep2',jury:{pro:pro,fr:fr,date:dt}}})}catch(e){}}

  btn.disabled=false;btn.textContent='\u2705 Valider et envoyer au serveur';
  if(err===0)toast('\u2705 '+sent+' \u00e9val(s) envoy\u00e9e(s)','ok');
  else toast('\u26a0 '+sent+' ok, '+err+' erreur(s)','warn')
}

// ═══ EXPOSE ═══
window.showDash=showDash;window.showDetail=showDetail;window.toggle=toggle;
window.setRetour=setRetour;window.setRetenu=setRetenu;window.retenuChanged=retenuChanged;window.setFr=setFr;window.envoyer=envoyer;

// ═══ GO ═══
init();
})();
</script>
